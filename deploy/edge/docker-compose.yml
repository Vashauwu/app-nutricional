# Caddy de entrada: único dueño de los puertos 80/443. Reparte por nombre de dominio hacia cada ambiente.
# El Caddyfile lo genera deploy.sh según los ambientes que existan.
name: nutri-edge
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
networks:
  edge:
    name: nutri-edge
    external: true
volumes:
  caddy_data:
  caddy_config:
