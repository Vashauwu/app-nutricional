# Un ambiente completo (prod o staging): frontend + proxy /api · API Go · PostgreSQL · MinIO.
# No publica puertos: el Caddy de entrada (deploy/edge) lo alcanza por la red "nutri-edge".
# Se opera con ./dc.sh <prod|staging> <comando>.
name: ${COMPOSE_PROJECT_NAME:-nutri-prod}
services:
  web:
    # Las imágenes salen del registro (CD). Sin IMAGE_REPO/IMAGE_TAG se compilan localmente (despliegue inicial con deploy.sh).
    image: ${IMAGE_REPO:-local}/nutri-web:${IMAGE_TAG:-dev}
    build: ../frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ":80"   # TLS lo termina el Caddy de entrada
    volumes:
      - ./config.js:/srv/config.js:ro
    networks:
      default:
      edge:
        aliases:
          - web-${ENV_NAME:?define ENV_NAME}

  api:
    image: ${IMAGE_REPO:-local}/nutri-api:${IMAGE_TAG:-dev}
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}
      DATABASE_URL: postgres://nutri:${POSTGRES_PASSWORD:?}@postgres:5432/nutri?sslmode=disable
      AUTO_MIGRATE: "true"
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?define PUBLIC_URL en deploy/.env}
      APP_BASE_URL: ${PUBLIC_URL}
      JWT_SECRET: ${JWT_SECRET:?}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: nutri
      S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Nutrición}

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: nutri
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutri -d nutri"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    # La imagen corre como usuario sin privilegios y no puede escribir en el volumen nombrado.
    user: "0:0"
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: nutri
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?}
    volumes:
      - miniodata:/data

networks:
  edge:
    name: nutri-edge
    external: true

volumes:
  pgdata:
  miniodata:
