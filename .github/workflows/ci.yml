# Integración continua: se ejecuta en cada pull request y en cada push a las ramas principales.
# Debe estar en verde antes de fusionar (activa la protección de la rama `main` y exige estos checks).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # en main lo ejecuta deploy.yml (reutiliza este flujo)
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Formato (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Sin formatear:"; echo "$unformatted"; exit 1; fi
      - name: Análisis estático (go vet)
        run: go vet ./...
      - name: El código generado por sqlc está al día
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          git diff --exit-code -- generated || { echo "Ejecuta 'sqlc generate' y sube los cambios."; exit 1; }
      - name: Pruebas (unitarias e integración con PostgreSQL y MinIO reales en contenedores)
        run: go test ./... -count=1 -timeout 15m

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pruebas
        run: npm test -- --watch=false
      - name: Compilación de producción
        run: npx ng build

  imagenes:
    name: Las imágenes de Docker compilan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
