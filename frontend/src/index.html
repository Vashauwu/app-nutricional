<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <title>Gestión nutricional</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF7F2" />
    <!-- El script de abajo cambia este ícono según el tema (claro: paleta pastel; oscuro: ciruela). -->
    <link rel="icon" id="app-favicon" type="image/png" href="icons/favicon-light.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <script>(function(){try{var t=localStorage.getItem("nutri-theme");var d=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";var f=document.getElementById("app-favicon");if(f)f.href="icons/favicon-"+(d?"dark":"light")+".png";}catch(e){}})();</script>
    <script src="config.js"></script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Activa JavaScript para usar esta aplicación.</noscript>
  </body>
</html>
